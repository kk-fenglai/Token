[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenscope"
version = "1.0.0"
description = "Claude Code token usage & cost analytics — MCP server + local web dashboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "mcp>=1.2",
]

[project.scripts]
tokenscope-mcp = "tokenscope.mcp_server:main"
tokenscope-web = "tokenscope.web:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

# static/ (frontend build) is committed to git and lives inside the package
# dir, so hatchling ships it in the wheel as package data automatically.
[tool.hatch.build.targets.wheel]
packages = ["src/tokenscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
